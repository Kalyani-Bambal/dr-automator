apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: dr-automator

  labels:
    app: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

      - name: backend

        image: 677078406480.dkr.ecr.ap-south-1.amazonaws.com/backend:v1

        imagePullPolicy: Always

        ports:

        - containerPort: 5000

        envFrom:

        - configMapRef:
            name: dr-automator-config

        - secretRef:
            name: dr-automator-secret

        resources:

          requests:
            cpu: "250m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        livenessProbe:

          httpGet:

            path: /health

            port: 5000

          initialDelaySeconds: 30

          periodSeconds: 20

          timeoutSeconds: 5

          failureThreshold: 3

        readinessProbe:

          httpGet:

            path: /health

            port: 5000

          initialDelaySeconds: 10

          periodSeconds: 10

          timeoutSeconds: 5

          failureThreshold: 3