services:

  mysql:

    image: mysql:8.0

    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: drapp

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:

    build:
      context: ./backend

    container_name: backend

    env_file:
      - backend/.env

    ports:
      - "5000:5000"

    depends_on:
      - mysql

  frontend:

    build:
      context: ./frontend

    container_name: frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:
  mysql_data: