
name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply-main
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Apply dev infrastructure
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform initialize
        working-directory: terraform/environments/dev
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Generate fresh Terraform plan
        working-directory: terraform/environments/dev
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Apply planned infrastructure changes
        working-directory: terraform/environments/dev
        run: terraform apply -input=false -lock-timeout=5m tfplan
