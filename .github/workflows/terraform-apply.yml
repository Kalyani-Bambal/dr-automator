
name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply-main
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Apply dev infrastructure
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Ensure Terraform remote state backend exists
        env:
          TF_STATE_BUCKET: dr-automator-terraform-state-ap-south-1
          TF_STATE_REGION: ap-south-1
          TF_LOCK_TABLE: dr-automator-terraform-state-lock
        run: |
          set -euo pipefail

          aws s3api head-bucket --bucket "$TF_STATE_BUCKET" --region "$TF_STATE_REGION" >/dev/null 2>&1 || \
          aws s3api create-bucket \
            --bucket "$TF_STATE_BUCKET" \
            --region "$TF_STATE_REGION" \
            --create-bucket-configuration "LocationConstraint=$TF_STATE_REGION"

          aws s3api put-bucket-versioning \
            --bucket "$TF_STATE_BUCKET" \
            --versioning-configuration Status=Enabled \
            --region "$TF_STATE_REGION"

          aws s3api put-bucket-encryption \
            --bucket "$TF_STATE_BUCKET" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}' \
            --region "$TF_STATE_REGION"

          aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" --region "$TF_STATE_REGION" >/dev/null 2>&1 || \
          aws dynamodb create-table \
            --table-name "$TF_LOCK_TABLE" \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 \
            --region "$TF_STATE_REGION"

      - name: Terraform initialize
        working-directory: terraform/environments/dev
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Generate fresh Terraform plan
        working-directory: terraform/environments/dev
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Apply planned infrastructure changes
        working-directory: terraform/environments/dev
        run: terraform apply -input=false -lock-timeout=5m tfplan
