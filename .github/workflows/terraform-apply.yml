
name: Terraform Apply - Manual

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-apply:
    name: Apply dev infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform initialize
        working-directory: terraform/environments/dev
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Generate fresh Terraform plan
        working-directory: terraform/environments/dev
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Apply planned infrastructure changes
        working-directory: terraform/environments/dev
        run: terraform apply -input=false -lock-timeout=5m tfplan
