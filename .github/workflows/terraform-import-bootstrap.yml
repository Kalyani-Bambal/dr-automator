---
name: "Terraform Import Bootstrap"

"on":
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  import-existing-resources:
    name: Import existing AWS resources into remote state
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Ensure Terraform remote state backend exists
        env:
          TF_STATE_BUCKET: dr-automator-terraform-state-ap-south-1
          TF_STATE_REGION: ap-south-1
          TF_LOCK_TABLE: dr-automator-terraform-state-lock
        run: |
          set -euo pipefail

          aws s3api head-bucket --bucket "$TF_STATE_BUCKET" --region "$TF_STATE_REGION" >/dev/null 2>&1 || \
          aws s3api create-bucket \
            --bucket "$TF_STATE_BUCKET" \
            --region "$TF_STATE_REGION" \
            --create-bucket-configuration "LocationConstraint=$TF_STATE_REGION"

          aws s3api put-bucket-versioning \
            --bucket "$TF_STATE_BUCKET" \
            --versioning-configuration Status=Enabled \
            --region "$TF_STATE_REGION"

          aws s3api put-bucket-encryption \
            --bucket "$TF_STATE_BUCKET" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}' \
            --region "$TF_STATE_REGION"

          aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" --region "$TF_STATE_REGION" >/dev/null 2>&1 || \
          aws dynamodb create-table \
            --table-name "$TF_LOCK_TABLE" \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 \
            --region "$TF_STATE_REGION"

      - name: Terraform initialize
        working-directory: terraform/environments/dev
        run: terraform init -input=false

      - name: Import existing resources into state once
        working-directory: terraform/environments/dev
        shell: bash
        run: |
          set -euo pipefail

          import_if_missing() {
            local address="$1"
            local id="$2"

            if terraform state list 2>/dev/null | grep -Fxq "$address"; then
              echo "[INFO] Already in state: $address"
              return 0
            fi

            echo "[INFO] Importing $address -> $id"
            terraform import "$address" "$id" || echo "[WARN] Import skipped or resource not found yet: $address"
          }

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          import_if_missing 'module.vpc.aws_vpc.this' "$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=dr-automator-dev-vpc" --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo '')"
          import_if_missing 'module.vpc_dr.aws_vpc.this' "$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=dr-automator-dev-dr-vpc" --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo '')"

          import_if_missing 'module.s3.aws_s3_bucket.primary' "dr-automator-dev-primary"
          import_if_missing 'module.s3.aws_s3_bucket.dr' "dr-automator-dev-dr"

          import_if_missing 'module.kms.aws_kms_alias.this' 'alias/dr-automator-dev-kms'
          import_if_missing 'module.kms_dr.aws_kms_alias.this' 'alias/dr-automator-dev-dr-kms'

          import_if_missing 'module.rds.aws_db_parameter_group.primary' 'dr-automator-dev-mysql-params'

          import_if_missing 'module.iam.aws_iam_instance_profile.node_group' 'dr-automator-dev-node-instance-profile'
          import_if_missing 'module.iam_dr.aws_iam_instance_profile.node_group' 'dr-automator-dev-dr-node-instance-profile'

          import_if_missing 'module.irsa.aws_iam_policy.aws_load_balancer_controller' "arn:aws:iam::${ACCOUNT_ID}:policy/dr-automator-dev-aws-load-balancer-controller-policy"
          import_if_missing 'module.irsa_dr.aws_iam_policy.aws_load_balancer_controller' "arn:aws:iam::${ACCOUNT_ID}:policy/dr-automator-dev-dr-aws-load-balancer-controller-policy"

          import_if_missing 'module.irsa.aws_iam_policy.cluster_autoscaler' "arn:aws:iam::${ACCOUNT_ID}:policy/dr-automator-dev-cluster-autoscaler-policy"
          import_if_missing 'module.irsa_dr.aws_iam_policy.cluster_autoscaler' "arn:aws:iam::${ACCOUNT_ID}:policy/dr-automator-dev-dr-cluster-autoscaler-policy"

      - name: Refresh state after import
        working-directory: terraform/environments/dev
        run: terraform refresh -input=false

      - name: Final state check
        working-directory: terraform/environments/dev
        run: terraform state list
