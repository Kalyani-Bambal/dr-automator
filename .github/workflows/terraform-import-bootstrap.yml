---
name: "Terraform Import Bootstrap"

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  import-existing-resources:
    name: Import existing AWS resources into remote state
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Ensure Terraform remote state backend exists
        env:
          TF_STATE_BUCKET: dr-automator-terraform-state-ap-south-1
          TF_STATE_REGION: ap-south-1
          TF_LOCK_TABLE: dr-automator-terraform-state-lock
        run: |
          set -euo pipefail

          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" --region "$TF_STATE_REGION" >/dev/null 2>&1; then
            if [ "$TF_STATE_REGION" = "us-east-1" ]; then
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET" \
                --region "$TF_STATE_REGION"
            else
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET" \
                --region "$TF_STATE_REGION" \
                --create-bucket-configuration "LocationConstraint=$TF_STATE_REGION"
            fi
          fi

          aws s3api put-bucket-versioning \
            --bucket "$TF_STATE_BUCKET" \
            --versioning-configuration Status=Enabled \
            --region "$TF_STATE_REGION"

          aws s3api put-bucket-encryption \
            --bucket "$TF_STATE_BUCKET" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}' \
            --region "$TF_STATE_REGION"

          if ! aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" --region "$TF_STATE_REGION" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$TF_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 \
              --region "$TF_STATE_REGION"
          fi

      - name: Terraform initialize
        working-directory: terraform/environments/dev
        run: terraform init -input=false -reconfigure

      - name: Import existing resources into state once
        working-directory: terraform/environments/dev
        run: |
          set -euo pipefail

          import_if_missing() {
            local address="$1"
            local id="${2:-}"

            if [[ -z "$id" ]]; then
              echo "[INFO] Skipping $address because no ID was resolved"
              return 0
            fi

            if terraform state list 2>/dev/null | grep -Fxq "$address"; then
              echo "[INFO] Already in state: $address"
              return 0
            fi

            echo "[INFO] Importing $address -> $id"
            terraform import "$address" "$id" || echo "[WARN] Import skipped or resource not found yet: $address"
          }

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          get_vpc_id_by_name() {
            local name="$1"
            aws ec2 describe-vpcs \
              --filters "Name=tag:Name,Values=${name}" \
              --query 'Vpcs[0].VpcId' \
              --output text 2>/dev/null || echo ''
          }

          get_subnet_id_by_name() {
            local vpc_id="$1"
            local name="$2"
            aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=${vpc_id}" "Name=tag:Name,Values=${name}" \
              --query 'Subnets[0].SubnetId' \
              --output text 2>/dev/null || echo ''
          }

          get_security_group_id_by_name() {
            local vpc_id="$1"
            local name="$2"
            aws ec2 describe-security-groups \
              --filters "Name=vpc-id,Values=${vpc_id}" "Name=group-name,Values=${name}" \
              --query 'SecurityGroups[0].GroupId' \
              --output text 2>/dev/null || echo ''
          }

          PRIMARY_VPC_ID=$(get_vpc_id_by_name 'dr-automator-dev-vpc')
          DR_VPC_ID=$(get_vpc_id_by_name 'dr-automator-dev-dr-vpc')

          import_if_missing 'module.vpc.aws_vpc.this' "$PRIMARY_VPC_ID"
          import_if_missing 'module.vpc_dr.aws_vpc.this' "$DR_VPC_ID"

          import_if_missing 'module.vpc.aws_internet_gateway.this' "$(aws ec2 describe-internet-gateways --filters "Name=tag:Name,Values=dr-automator-dev-igw" --query 'InternetGateways[0].InternetGatewayId' --output text 2>/dev/null || echo '')"
          import_if_missing 'module.vpc_dr.aws_internet_gateway.this' "$(aws ec2 describe-internet-gateways --filters "Name=tag:Name,Values=dr-automator-dev-dr-igw" --query 'InternetGateways[0].InternetGatewayId' --output text 2>/dev/null || echo '')"

          import_if_missing 'module.vpc.aws_subnet.public[0]' "$(get_subnet_id_by_name "$PRIMARY_VPC_ID" 'dr-automator-dev-public-1')"
          import_if_missing 'module.vpc.aws_subnet.public[1]' "$(get_subnet_id_by_name "$PRIMARY_VPC_ID" 'dr-automator-dev-public-2')"
          import_if_missing 'module.vpc.aws_subnet.private[0]' "$(get_subnet_id_by_name "$PRIMARY_VPC_ID" 'dr-automator-dev-private-1')"
          import_if_missing 'module.vpc.aws_subnet.private[1]' "$(get_subnet_id_by_name "$PRIMARY_VPC_ID" 'dr-automator-dev-private-2')"

          import_if_missing 'module.vpc_dr.aws_subnet.public[0]' "$(get_subnet_id_by_name "$DR_VPC_ID" 'dr-automator-dev-dr-public-1')"
          import_if_missing 'module.vpc_dr.aws_subnet.public[1]' "$(get_subnet_id_by_name "$DR_VPC_ID" 'dr-automator-dev-dr-public-2')"
          import_if_missing 'module.vpc_dr.aws_subnet.private[0]' "$(get_subnet_id_by_name "$DR_VPC_ID" 'dr-automator-dev-dr-private-1')"
          import_if_missing 'module.vpc_dr.aws_subnet.private[1]' "$(get_subnet_id_by_name "$DR_VPC_ID" 'dr-automator-dev-dr-private-2')"

          import_if_missing 'module.vpc.aws_eip.nat' "$(aws ec2 describe-addresses --filters "Name=tag:Name,Values=dr-automator-dev-nat-eip" --query 'Addresses[0].AllocationId' --output text 2>/dev/null || echo '')"
          import_if_missing 'module.vpc_dr.aws_eip.nat' "$(aws ec2 describe-addresses --filters "Name=tag:Name,Values=dr-automator-dev-dr-nat-eip" --query 'Addresses[0].AllocationId' --output text 2>/dev/null || echo '')"

          import_if_missing 'module.vpc.aws_nat_gateway.this' "$(aws ec2 describe-nat-gateways --filter "Name=tag:Name,Values=dr-automator-dev-nat-gateway" --query 'NatGateways[0].NatGatewayId' --output text 2>/dev/null || echo '')"
          import_if_missing 'module.vpc_dr.aws_nat_gateway.this' "$(aws ec2 describe-nat-gateways --filter "Name=tag:Name,Values=dr-automator-dev-dr-nat-gateway" --query 'NatGateways[0].NatGatewayId' --output text 2>/dev/null || echo '')"

          import_if_missing 'module.vpc.aws_route_table.public' "$(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=${PRIMARY_VPC_ID}" "Name=tag:Name,Values=dr-automator-dev-public-rt" --query 'RouteTables[0].RouteTableId' --output text 2>/dev/null || echo '')"
          import_if_missing 'module.vpc.aws_route_table.private' "$(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=${PRIMARY_VPC_ID}" "Name=tag:Name,Values=dr-automator-dev-private-rt" --query 'RouteTables[0].RouteTableId' --output text 2>/dev/null || echo '')"
          import_if_missing 'module.vpc_dr.aws_route_table.public' "$(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=${DR_VPC_ID}" "Name=tag:Name,Values=dr-automator-dev-dr-public-rt" --query 'RouteTables[0].RouteTableId' --output text 2>/dev/null || echo '')"
          import_if_missing 'module.vpc_dr.aws_route_table.private' "$(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=${DR_VPC_ID}" "Name=tag:Name,Values=dr-automator-dev-dr-private-rt" --query 'RouteTables[0].RouteTableId' --output text 2>/dev/null || echo '')"

          import_if_missing 'module.security_groups.aws_security_group.alb' "$(get_security_group_id_by_name "$PRIMARY_VPC_ID" 'dr-automator-dev-alb-sg')"
          import_if_missing 'module.security_groups.aws_security_group.eks_cluster' "$(get_security_group_id_by_name "$PRIMARY_VPC_ID" 'dr-automator-dev-eks-cluster-sg')"
          import_if_missing 'module.security_groups.aws_security_group.node' "$(get_security_group_id_by_name "$PRIMARY_VPC_ID" 'dr-automator-dev-node-sg')"
          import_if_missing 'module.security_groups.aws_security_group.database' "$(get_security_group_id_by_name "$PRIMARY_VPC_ID" 'dr-automator-dev-database-sg')"
          import_if_missing 'module.security_groups.aws_security_group.bastion' "$(get_security_group_id_by_name "$PRIMARY_VPC_ID" 'dr-automator-dev-bastion-sg')"

          import_if_missing 'module.security_groups_dr.aws_security_group.alb' "$(get_security_group_id_by_name "$DR_VPC_ID" 'dr-automator-dev-dr-alb-sg')"
          import_if_missing 'module.security_groups_dr.aws_security_group.eks_cluster' "$(get_security_group_id_by_name "$DR_VPC_ID" 'dr-automator-dev-dr-eks-cluster-sg')"
          import_if_missing 'module.security_groups_dr.aws_security_group.node' "$(get_security_group_id_by_name "$DR_VPC_ID" 'dr-automator-dev-dr-node-sg')"
          import_if_missing 'module.security_groups_dr.aws_security_group.database' "$(get_security_group_id_by_name "$DR_VPC_ID" 'dr-automator-dev-dr-database-sg')"
          import_if_missing 'module.security_groups_dr.aws_security_group.bastion' "$(get_security_group_id_by_name "$DR_VPC_ID" 'dr-automator-dev-dr-bastion-sg')"

          import_if_missing 'module.s3.aws_s3_bucket.primary' 'dr-automator-dev-primary'
          import_if_missing 'module.s3.aws_s3_bucket.dr' 'dr-automator-dev-dr'

          import_if_missing 'module.kms.aws_kms_alias.this' 'alias/dr-automator-dev-kms'
          import_if_missing 'module.kms_dr.aws_kms_alias.this' 'alias/dr-automator-dev-dr-kms'

          import_if_missing 'module.rds.aws_db_parameter_group.primary' 'dr-automator-dev-mysql-params'
          import_if_missing 'module.rds.aws_db_subnet_group.primary' 'dr-automator-dev-db-subnet-primary'
          import_if_missing 'module.rds.aws_db_instance.primary' 'dr-automator-dev-mysql'

          import_if_missing 'module.iam.aws_iam_instance_profile.node_group' 'dr-automator-dev-node-instance-profile'
          import_if_missing 'module.iam_dr.aws_iam_instance_profile.node_group' 'dr-automator-dev-dr-node-instance-profile'

          import_if_missing 'module.iam.aws_iam_role.eks_cluster' 'dr-automator-dev-eks-cluster-role'
          import_if_missing 'module.iam.aws_iam_role.node_group' 'dr-automator-dev-node-group-role'
          import_if_missing 'module.iam_dr.aws_iam_role.eks_cluster' 'dr-automator-dev-dr-eks-cluster-role'
          import_if_missing 'module.iam_dr.aws_iam_role.node_group' 'dr-automator-dev-dr-node-group-role'

          import_if_missing 'module.irsa.aws_iam_policy.aws_load_balancer_controller' "arn:aws:iam::${ACCOUNT_ID}:policy/dr-automator-dev-aws-load-balancer-controller-policy"
          import_if_missing 'module.irsa_dr.aws_iam_policy.aws_load_balancer_controller' "arn:aws:iam::${ACCOUNT_ID}:policy/dr-automator-dev-dr-aws-load-balancer-controller-policy"

          import_if_missing 'module.irsa.aws_iam_policy.cluster_autoscaler' "arn:aws:iam::${ACCOUNT_ID}:policy/dr-automator-dev-cluster-autoscaler-policy"
          import_if_missing 'module.irsa_dr.aws_iam_policy.cluster_autoscaler' "arn:aws:iam::${ACCOUNT_ID}:policy/dr-automator-dev-dr-cluster-autoscaler-policy"

          import_if_missing 'module.eks.aws_eks_cluster.this' 'dr-automator-dev-eks'
          import_if_missing 'module.eks_dr.aws_eks_cluster.this' 'dr-automator-dev-dr-eks'
          import_if_missing 'module.eks.aws_eks_node_group.this' 'dr-automator-dev-eks:dr-automator-dev-eks-node-group'
          import_if_missing 'module.eks_dr.aws_eks_node_group.this' 'dr-automator-dev-dr-eks:dr-automator-dev-dr-eks-node-group'

      - name: Refresh state after import
        working-directory: terraform/environments/dev
        run: terraform refresh -input=false

      - name: Final state check
        working-directory: terraform/environments/dev
        run: terraform state list
