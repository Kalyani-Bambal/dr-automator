
name: Build and Deploy Application

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Validate required configuration
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${AWS_REGION:?Missing AWS_REGION repository variable}"
          : "${AWS_ACCOUNT_ID:?Missing AWS_ACCOUNT_ID repository variable}"
          : "${EKS_CLUSTER_NAME:?Missing EKS_CLUSTER_NAME repository variable}"
          : "${K8S_NAMESPACE:?Missing K8S_NAMESPACE repository variable}"
          : "${AWS_ROLE_ARN:?Missing AWS_ROLE_ARN repository variable}"

          if [[ "$K8S_NAMESPACE" != "dr-automator" ]]; then
            echo "Error: kubernetes manifests currently use namespace dr-automator."
            exit 1
          fi

      # 3. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsDeploy

      # 4. Verify AWS identity and account
      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          ACTUAL_ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          if [[ "$ACTUAL_ACCOUNT_ID" != "$AWS_ACCOUNT_ID" ]]; then
            echo "Error: AWS account ID does not match."
            exit 1
          fi

      # 5. Verify EKS cluster
      - name: Verify EKS cluster
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME" \
            --query 'cluster.status' \
            --output text)

          echo "EKS cluster status: $STATUS"

          if [[ "$STATUS" != "ACTIVE" ]]; then
            echo "Error: EKS cluster is not ACTIVE."
            exit 1
          fi

      # 6. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Build and push backend image
      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -t "$REGISTRY/backend:$IMAGE_TAG" \
            ./backend

          docker push "$REGISTRY/backend:$IMAGE_TAG"

      # 8. Build and push frontend image
      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -t "$REGISTRY/frontend:$IMAGE_TAG" \
            ./frontend

          docker push "$REGISTRY/frontend:$IMAGE_TAG"

      # 9. Configure kubectl for EKS
      - name: Configure kubectl for EKS
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          aws eks get-token \
            --region "$AWS_REGION" \
            --cluster-name "$EKS_CLUSTER_NAME" \
            > /dev/null

      # 10. Verify existing namespace
      - name: Verify Kubernetes namespace
        shell: bash
        run: |
          set -euo pipefail

          kubectl get namespace "$K8S_NAMESPACE"

          kubectl wait \
            --for=jsonpath='{.status.phase}'=Active \
            "namespace/$K8S_NAMESPACE" \
            --timeout=120s

      # 11. Verify namespace-level Kubernetes permissions
      - name: Verify Kubernetes deployment access
        shell: bash
        run: |
          set -euo pipefail

          for RESOURCE in deployments services configmaps secrets; do
            kubectl auth can-i create "$RESOURCE" \
              --namespace="$K8S_NAMESPACE" | grep -qx "yes"

            kubectl auth can-i get "$RESOURCE" \
              --namespace="$K8S_NAMESPACE" | grep -qx "yes"
          done

          kubectl auth can-i patch deployments \
            --namespace="$K8S_NAMESPACE" | grep -qx "yes"

          kubectl auth can-i get pods \
            --namespace="$K8S_NAMESPACE" | grep -qx "yes"

          echo "Required namespace permissions verified."

      # 12. Apply Kubernetes ConfigMap
      - name: Apply Kubernetes ConfigMap
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -f kubernetes/configmap.yaml

          kubectl get configmap dr-automator-config \
            --namespace="$K8S_NAMESPACE"

      # 13. Create or update Kubernetes Secret securely
      - name: Apply Kubernetes Secret
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          : "${DB_USER:?Missing DB_USER GitHub Actions secret}"
          : "${DB_PASSWORD:?Missing DB_PASSWORD GitHub Actions secret}"

          kubectl create secret generic dr-automator-secret \
            --namespace="$K8S_NAMESPACE" \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          echo "Kubernetes Secret applied successfully."

      # 14. Apply Kubernetes Services
      - name: Apply Kubernetes services
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply \
            -f kubernetes/backend/service.yaml \
            -n "$K8S_NAMESPACE"

          kubectl apply \
            -f kubernetes/frontend/service.yaml \
            -n "$K8S_NAMESPACE"

      # 15. Apply Kubernetes Deployments
      - name: Apply Kubernetes deployments
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply \
            -f kubernetes/backend/deployment.yaml \
            -n "$K8S_NAMESPACE"

          kubectl apply \
            -f kubernetes/frontend/deployment.yaml \
            -n "$K8S_NAMESPACE"

      # 16. Update application images
      - name: Update application images
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          kubectl set image deployment/backend \
            backend="$REGISTRY/backend:$IMAGE_TAG" \
            -n "$K8S_NAMESPACE"

          kubectl set image deployment/frontend \
            frontend="$REGISTRY/frontend:$IMAGE_TAG" \
            -n "$K8S_NAMESPACE"

      # 17. Wait for backend rollout
      - name: Wait for backend rollout
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout status deployment/backend \
            -n "$K8S_NAMESPACE" \
            --timeout=300s

      # 18. Wait for frontend rollout
      - name: Wait for frontend rollout
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout status deployment/frontend \
            -n "$K8S_NAMESPACE" \
            --timeout=300s

      # 19. Verify deployed resources
      - name: Verify deployed resources
        shell: bash
        run: |
          set -euo pipefail

          kubectl get configmaps -n "$K8S_NAMESPACE"
          kubectl get secrets -n "$K8S_NAMESPACE"
          kubectl get deployments -n "$K8S_NAMESPACE"
          kubectl get pods -n "$K8S_NAMESPACE"
          kubectl get services -n "$K8S_NAMESPACE"

      # 20. Print deployment summary
      - name: Deployment summary
        if: success()
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Deployment completed successfully."
          echo "AWS Region: $AWS_REGION"
          echo "EKS Cluster: $EKS_CLUSTER_NAME"
          echo "Namespace: $K8S_NAMESPACE"
          echo "Image Tag: $IMAGE_TAG"
