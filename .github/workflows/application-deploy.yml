name: Build and Deploy Application

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Validate required configuration
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${AWS_REGION:?Missing AWS_REGION repository variable}"
          : "${AWS_ACCOUNT_ID:?Missing AWS_ACCOUNT_ID repository variable}"
          : "${EKS_CLUSTER_NAME:?Missing EKS_CLUSTER_NAME repository variable}"
          : "${K8S_NAMESPACE:?Missing K8S_NAMESPACE repository variable}"

          if [[ "$AWS_REGION" != "ap-south-1" ]]; then
            echo "Error: Expected AWS_REGION=ap-south-1."
            exit 1
          fi

          if [[ "$AWS_ACCOUNT_ID" != "926658607256" ]]; then
            echo "Error: AWS account ID does not match expected account."
            exit 1
          fi

          if [[ "$K8S_NAMESPACE" != "dr-automator" ]]; then
            echo "Error: Expected namespace dr-automator."
            exit 1
          fi

      # 3. Inspect GitHub OIDC claims (does not print the full token)
      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "GitHub OIDC request variables are unavailable."
            exit 1
          fi

          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          export OIDC_RESPONSE="$RESPONSE"

          node <<'NODE'
          const response = JSON.parse(process.env.OIDC_RESPONSE);
          if (!response.value) {
            throw new Error("GitHub did not return an OIDC token.");
          }
          const payload = JSON.parse(
            Buffer.from(response.value.split(".")[1], "base64url").toString("utf8")
          );
          console.log("OIDC sub:", payload.sub);
          console.log("OIDC aud:", payload.aud);
          NODE

      # 4. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::926658607256:role/dr-automator-github-actions
          aws-region: ap-south-1
          audience: sts.amazonaws.com
          role-session-name: GitHubActionsDeploy

      # 5. Verify AWS identity and account
      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          ACTUAL_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$ACTUAL_ACCOUNT_ID" != "$AWS_ACCOUNT_ID" ]]; then
            echo "Error: AWS account ID does not match."
            exit 1
          fi

      # 6. Verify EKS cluster
      - name: Verify EKS cluster
        shell: bash
        run: |
          set -euo pipefail

          STATUS="$(aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME" \
            --query 'cluster.status' \
            --output text)"

          echo "EKS cluster status: $STATUS"
          if [[ "$STATUS" != "ACTIVE" ]]; then
            echo "Error: EKS cluster is not ACTIVE."
            exit 1
          fi

      # 7. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 8. Build and push backend image
      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker build -t "$REGISTRY/backend:$IMAGE_TAG" ./backend
          docker push "$REGISTRY/backend:$IMAGE_TAG"

      # 9. Build and push frontend image
      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker build -t "$REGISTRY/frontend:$IMAGE_TAG" ./frontend
          docker push "$REGISTRY/frontend:$IMAGE_TAG"

      # 10. Configure kubectl for EKS
      - name: Configure kubectl for EKS
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          aws eks get-token --region "$AWS_REGION" --cluster-name "$EKS_CLUSTER_NAME" >/dev/null

      # 11. Verify existing namespace (do not create it)
      - name: Verify Kubernetes namespace
        shell: bash
        run: |
          set -euo pipefail
          kubectl get namespace "$K8S_NAMESPACE"
          kubectl wait \
            --for=jsonpath='{.status.phase}'=Active \
            "namespace/$K8S_NAMESPACE" \
            --timeout=120s

      # 12. Verify namespace-level permissions
      - name: Verify Kubernetes deployment access
        shell: bash
        run: |
          set -euo pipefail

          for RESOURCE in deployments services configmaps secrets; do
            kubectl auth can-i create "$RESOURCE" --namespace="$K8S_NAMESPACE" | grep -qx "yes"
            kubectl auth can-i get "$RESOURCE" --namespace="$K8S_NAMESPACE" | grep -qx "yes"
          done

          kubectl auth can-i patch deployments --namespace="$K8S_NAMESPACE" | grep -qx "yes"
          kubectl auth can-i get pods --namespace="$K8S_NAMESPACE" | grep -qx "yes"

          echo "Required namespace permissions verified."

      # 13. Apply ConfigMap
      - name: Apply Kubernetes ConfigMap
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f kubernetes/configmap.yaml
          kubectl get configmap dr-automator-config --namespace="$K8S_NAMESPACE"

      # 14. Create or update Secret from GitHub Actions secrets
      - name: Apply Kubernetes Secret
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DB_USER:?Missing DB_USER GitHub Actions secret}"
          : "${DB_PASSWORD:?Missing DB_PASSWORD GitHub Actions secret}"

          kubectl create secret generic dr-automator-secret \
            --namespace="$K8S_NAMESPACE" \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          echo "Kubernetes Secret applied."

      # 15. Apply Kubernetes Services
      - name: Apply Kubernetes services
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f kubernetes/backend/service.yaml -n "$K8S_NAMESPACE"
          kubectl apply -f kubernetes/frontend/service.yaml -n "$K8S_NAMESPACE"

      # 16. Apply Kubernetes Deployments
      - name: Apply Kubernetes deployments
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f kubernetes/backend/deployment.yaml -n "$K8S_NAMESPACE"
          kubectl apply -f kubernetes/frontend/deployment.yaml -n "$K8S_NAMESPACE"

      # 17. Update application images
      - name: Update application images
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          kubectl set image deployment/backend \
            backend="$REGISTRY/backend:$IMAGE_TAG" \
            -n "$K8S_NAMESPACE"

          kubectl set image deployment/frontend \
            frontend="$REGISTRY/frontend:$IMAGE_TAG" \
            -n "$K8S_NAMESPACE"

      # 18. Wait for backend rollout
      - name: Wait for backend rollout
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/backend \
            -n "$K8S_NAMESPACE" \
            --timeout=300s

      # 19. Wait for frontend rollout
      - name: Wait for frontend rollout
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/frontend \
            -n "$K8S_NAMESPACE" \
            --timeout=300s

      # 20. Verify deployed resources
      - name: Verify deployed resources
        shell: bash
        run: |
          set -euo pipefail
          kubectl get configmaps -n "$K8S_NAMESPACE"
          kubectl get deployments -n "$K8S_NAMESPACE"
          kubectl get pods -n "$K8S_NAMESPACE"
          kubectl get services -n "$K8S_NAMESPACE"

          echo "Deployment verification completed."

      # 21. Print deployment summary
      - name: Deployment summary
        if: success()
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Deployment completed successfully."
          echo "AWS Region: $AWS_REGION"
          echo "EKS Cluster: $EKS_CLUSTER_NAME"
          echo "Namespace: $K8S_NAMESPACE"
          echo "Image Tag: $IMAGE_TAG"
